<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17152f">
<title>A Little Gift For You 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&family=Noto+Sans+Lao:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root {
        --font: "Sarabun", "Noto Sans Lao", "Noto Sans Thai", "Thonburi", Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        font-family: var(--font);
        color: #fff;
        background: linear-gradient(180deg, #100f26, #302344 55%, #69415e);
        background-attachment: fixed;
    }
    .container {
        width: 100%;
        max-width: 480px;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        padding:
            calc(24px + env(safe-area-inset-top, 0px))
            20px
            calc(24px + env(safe-area-inset-bottom, 0px));
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
        isolation: isolate;
    }
    h1 {
        position: relative;
        z-index: 2;
        margin: 0 0 12px;
        font-size: 25px;
        line-height: 1.5;
        transition: opacity 0.5s ease;
    }
    .subtitle {
        position: relative;
        z-index: 2;
        margin: 0;
        min-height: 78px;
        color: #ffe0ed;
        font-size: 16px;
        line-height: 1.7;
        transition: opacity 0.4s ease;
    }
    .subtitle.count {
        font-size: 64px;
        font-weight: 700;
        line-height: 1.2;
        animation: pop 0.8s ease-out;
    }
    .text-hidden { opacity: 0; }
    @keyframes pop {
        0%   { transform: scale(0.4); opacity: 0; }
        35%  { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1);   opacity: 1; }
    }

    /* ===== กล่องของขวัญ ===== */
    .gift {
        position: relative;
        width: 150px;
        height: 150px;
        flex-shrink: 0;
        margin-top: 40px;
        cursor: pointer;
        z-index: 2;
        animation: float 2s ease-in-out infinite;
        -webkit-tap-highlight-color: transparent;
        outline: none;
    }
    .gift:focus-visible { outline: 3px solid #fff0b8; outline-offset: 10px; border-radius: 12px; }
    .box {
        position: absolute;
        bottom: 0;
        width: 150px;
        height: 105px;
        background: #ff76a5;
        border-radius: 8px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.16);
    }
    .ribbon {
        position: absolute;
        top: 45px;
        left: 62px;
        width: 26px;
        height: 105px;
        background: #fff0b8;
        pointer-events: none;
    }
    .lid {
        position: absolute;
        top: 15px;
        left: -8px;
        width: 166px;
        height: 30px;
        background: #ffabc9;
        border-radius: 6px;
        transform-origin: left bottom;
        transition: transform 0.7s ease;
    }
    .lid-ribbon {
        position: absolute;
        top: 0;
        left: 70px;
        width: 26px;
        height: 100%;
        background: #fff0b8;
    }
    /* โบว์ */
    .lid::before, .lid::after {
        content: "";
        position: absolute;
        top: -17px;
        width: 26px;
        height: 20px;
        border: 5px solid #fff0b8;
        border-radius: 50%;
    }
    .lid::before { left: 52px; transform: rotate(-25deg); }
    .lid::after  { left: 78px; transform: rotate(25deg); }

    .gift.open {
        animation: none;
        opacity: 0;
        transform: scale(0.5);
        transition: opacity 0.7s ease, transform 0.7s ease;
        pointer-events: none;
    }
    .gift.open .lid { transform: translate(-25px, -45px) rotate(-25deg); }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-12px); }
    }

    /* ===== ปุ่ม ===== */
    .open-button {
        position: relative;
        z-index: 6;
        padding: 13px 25px;
        border: none;
        border-radius: 30px;
        background: #fff0f6;
        color: #9a4569;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    .open-button { margin-top: 32px; }
    #viewButton:not(.hidden) { animation: pop 0.6s ease-out; }
    .open-button:active { transform: scale(0.95); }
    .open-button:focus-visible { outline: 3px solid #fff0b8; outline-offset: 3px; }
    .hidden { display: none !important; }

    /* ===== Canvas พลุ (เต็มจอ) ===== */
    #fireworks {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
    }
    /* ===== รูปภาพ ===== */
    .photo-area {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(270px, 76%);
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translate(-50%, -43%) scale(0.85);
        opacity: 0;
        visibility: hidden;
        z-index: 5;
        pointer-events: none;
        transition: opacity 1.2s ease, transform 1.2s ease, visibility 1.2s;
    }
    .photo-area.show {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -50%) scale(1);
    }
    .photo-frame {
        width: 100%;
        height: clamp(200px, 42dvh, 310px);
        border: 7px solid #fff;
        border-radius: 14px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
        box-shadow:
            0 0 20px rgba(255, 182, 217, 0.8),
            0 0 50px rgba(255, 112, 183, 0.35);
    }
    .photo-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 55%;
    }
    /* กรณีไม่มีไฟล์รูป */
    .photo-area.no-photo .photo-frame img { display: none; }
    .photo-area.no-photo .photo-frame::after {
        content: "💗";
        display: grid;
        place-items: center;
        height: 100%;
        font-size: 80px;
    }
    .love-message {
        margin: 0;
        padding: 18px 4px 0;
        color: #fff4fa;
        font-size: clamp(18px, 5.6vw, 24px);
        font-weight: 700;
        line-height: 1.5;
        text-align: center;
        text-wrap: balance;
        text-shadow:
            0 0 8px rgba(255, 150, 205, 0.9),
            0 2px 12px rgba(30, 10, 35, 0.8);
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 1.5s ease, transform 1.5s ease;
    }
    .love-message.show { opacity: 1; transform: translateY(0); }
    .typed {
        min-height: 1.5em;
        font-size: clamp(24px, 7.5vw, 32px);
        letter-spacing: 3px;
    }
    .typed.typing::after {
        content: "|";
        margin-left: 2px;
        font-weight: 400;
        animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .meow {
        margin-top: 2px;
        font-size: clamp(18px, 5.5vw, 22px);
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .meow.show { opacity: 1; transform: translateY(0); }

    @media (max-height: 650px) {
        .container {
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        }
        .gift { margin-top: 18px; }
        .open-button { margin-top: 20px; }
        .photo-area { width: min(220px, 70%); }
        .love-message { padding-top: 12px; }
        h1 { font-size: 21px; }
    }
    @media (prefers-reduced-motion: reduce) {
        .gift { animation: none; }
    }
</style>
</head>
<body>
<main class="container">
    <h1 id="title">ก็อกๆ มีหยังจะบอก~~ 🎁</h1>
    <p class="subtitle" id="subtitle" aria-live="polite">กดเปิดกล่องดูสิ มีอะไรพิเศษรออยู่ 💗</p>

    <div class="gift" id="gift" role="button" tabindex="0" aria-label="เปิดกล่องของขวัญ">
        <div class="box"></div>
        <div class="ribbon"></div>
        <div class="lid"><span class="lid-ribbon"></span></div>
    </div>

    <button class="open-button" id="openButton" type="button">เปิดของขวัญ 💌</button>
    <button class="open-button hidden" id="viewButton" type="button">เปิดดูรูป 📸</button>

    <canvas id="fireworks" aria-hidden="true"></canvas>

<script>
(() => {
    "use strict";

    // =====================================
    // 0. ค่าตั้งต้น (แก้ข้อความ/เวลาได้ที่นี่)
    // =====================================
    const CAPTION = "5555555";             // ข้อความที่พิมพ์ทีละตัวใต้รูป
    const MEOW = "ຫມ້ຽວ";                // ข้อความใต้ CAPTION
    const TYPE_DELAY = 2000;               // หน่วงหลังรูปขึ้น (ms)
    const HOLD_TIME = 2000;                // ข้อความค้างอยู่กี่ ms หลังขึ้นครบ แล้วจางหาย
    const TYPE_SPEED = 200;                // ความเร็วพิมพ์ต่อตัว (ms)
    const SALVO_COUNT  = 30;          // จำนวนจรวดที่ยิงพร้อมกัน
    const SALVO_FRAMES = 70;          // เวลาบิน (เฟรม ≈ 1.1 วินาที) ทุกลูกเท่ากัน จึงแตกพร้อมกัน
    const SALVO_WAIT   = 3300;        // รอให้พลุแตกและจางก่อนขึ้นปุ่มเปิดดูรูป (ms)
    const AMBIENT_DURATION  = 25000;  // หัวใจลอยหลังโชว์รูป (ms)
    const MAX_PARTICLES     = 4000;
    const TAU = Math.PI * 2;

    const COLORS = ["#ff7eb6", "#ffd166", "#a9f0ff", "#c9a0ff", "#ffffff", "#ff9b71", "#ff5d8f", "#a6ffcb"];
    const PINKS  = ["#ff7eb6", "#ff5d8f", "#ffabc9", "#ffd1e3", "#ffffff"];

    // =====================================
    // 1. องค์ประกอบ
    // =====================================
    const $ = id => document.getElementById(id);
    const gift = $("gift"), button = $("openButton"), viewBtn = $("viewButton");
    const title = $("title"), subtitle = $("subtitle");
    const canvas = $("fireworks"), ctx = canvas.getContext("2d");
    const photoArea = $("photoArea"), loveMessage = $("loveMessage");
    const photoImg = photoArea.querySelector("img");

    const typedEl = $("typed"), meowEl = $("meow");
    meowEl.textContent = MEOW;

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // =====================================
    // 2. สถานะ
    // =====================================
    let W = 0, H = 0, DPR = 1;
    let opened = false, sceneRunning = false;
    let ambient = false;
    let rafId = null, lastTime = 0;
    let ambientUntil = 0, nextHeart = 0;
    let rockets = [], particles = [], flashes = [], stars = [], hearts = [];

    const timers = new Set();
    function later(fn, ms) {
        const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
        timers.add(id);
        return id;
    }
    function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    // =====================================
    // 3. ปรับขนาด Canvas
    // =====================================
    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = rect.width;
        H = rect.height;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        createStars();
    }
    let resizeQueued = false;
    window.addEventListener("resize", () => {
        if (resizeQueued) return;
        resizeQueued = true;
        requestAnimationFrame(() => { resizeQueued = false; resizeCanvas(); });
    });

    // =====================================
    // 4. ดาว
    // =====================================
    function createStars() {
        stars = [];
        const count = Math.min(70, Math.floor(W * H / 9000));
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H * 0.8,
                size: rand(0.5, 1.8),
                alpha: rand(0.2, 0.9),
                phase: Math.random() * TAU
            });
        }
    }
    function drawStars(time, fade) {
        ctx.fillStyle = "#fff";
        for (const s of stars) {
            ctx.globalAlpha = s.alpha * (0.55 + Math.sin(time * 0.002 + s.phase) * 0.35) * fade;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // =====================================
    // 5. จรวดและการระเบิด
    // =====================================
    // จรวดทุกลูกบินด้วยจำนวนเฟรมเท่ากัน จึงไปถึงเป้าและแตกพร้อมกัน
    function launchRocket(targetX, targetY, frames) {
        const startX = clamp(targetX + rand(-W * 0.12, W * 0.12), W * 0.1, W * 0.9);
        const startY = H + 10;
        rockets.push({
            x: startX, y: startY,
            vx: (targetX - startX) / frames,
            vy: (targetY - startY) / frames,
            targetX, targetY,
            color: pick(COLORS),
            trail: [],
            style: Math.floor(Math.random() * 3)
        });
    }

    function launchSalvo() {
        for (let i = 0; i < SALVO_COUNT; i++) {
            const tx = W * (0.07 + 0.86 * (i + rand(0.2, 0.8)) / SALVO_COUNT);
            const ty = H * rand(0.1, 0.5);
            launchRocket(tx, ty, SALVO_FRAMES + rand(-3, 3));
        }
    }

    function addParticle(x, y, vx, vy, color, size, life, gravity, decay) {
        if (particles.length > MAX_PARTICLES) return;
        particles.push({
            x, y, vx, vy, color, size, life, gravity,
            decay: decay ?? rand(0.009, 0.023),
            phase: Math.random() * TAU
        });
    }

    function explodeRocket(r) {
        {
            const count = 70 + Math.floor(Math.random() * 25);
            const rot = Math.random() * TAU;
            for (let i = 0; i < count; i++) {
                const a = TAU * i / count + rot;
                let sp;
                if (r.style === 0) sp = rand(1.3, 5.5);
                else if (r.style === 1) sp = rand(2, 7);
                else sp = rand(3, 3.9); // วงแหวน
                addParticle(
                    r.x, r.y, Math.cos(a) * sp, Math.sin(a) * sp,
                    Math.random() < 0.25 ? pick(COLORS) : r.color,
                    rand(1.2, 3.4), rand(0.8, 1.3), rand(0.025, 0.06)
                );
            }
        }
        for (let i = 0; i < 15; i++) {
            const a = Math.random() * TAU, sp = rand(1, 4);
            addParticle(r.x, r.y, Math.cos(a) * sp, Math.sin(a) * sp, "#fff", rand(0.8, 2.2), rand(0.5, 1), 0.04);
        }
        flashes.push({ x: r.x, y: r.y, life: 1, color: r.color, size: rand(40, 70) });
    }

    function drawRockets(dt) {
        const remaining = [];
        ctx.globalCompositeOperation = "lighter";
        for (const r of rockets) {
            r.trail.push({ x: r.x, y: r.y });
            if (r.trail.length > 9) r.trail.shift();
            ctx.fillStyle = r.color;
            for (let i = 0; i < r.trail.length; i++) {
                ctx.globalAlpha = (i + 1) / r.trail.length * 0.6;
                ctx.beginPath();
                ctx.arc(r.trail[i].x, r.trail[i].y, 1.6, 0, TAU);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(r.x, r.y, 2.4, 0, TAU);
            ctx.fill();

            r.x += r.vx * dt;
            r.y += r.vy * dt;
            const reach = Math.hypot(r.vx, r.vy) * dt + 2;
            if (Math.hypot(r.targetX - r.x, r.targetY - r.y) <= reach) explodeRocket(r);
            else remaining.push(r);
        }
        rockets = remaining;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
    }

    function drawParticles(dt) {
        const alive = [];
        const drag = Math.pow(0.985, dt);
        ctx.globalCompositeOperation = "lighter";
        for (const p of particles) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += p.gravity * dt;
            p.vx *= drag;
            p.vy *= drag;
            p.life -= p.decay * dt;
            if (p.life <= 0) continue;
            const a = clamp(p.life, 0, 1) * (0.75 + Math.sin(p.phase + p.life * 30) * 0.25);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = a;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, TAU);
            ctx.fill();
            if (p.size > 1.8) { // เรืองแสงแบบเบา ๆ แทน shadowBlur
                ctx.globalAlpha = a * 0.16;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 2.8, 0, TAU);
                ctx.fill();
            }
            alive.push(p);
        }
        particles = alive;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
    }

    function drawFlashes(dt) {
        const remaining = [];
        for (const f of flashes) {
            if (f.life <= 0.02) continue;
            const radius = f.size * f.life;
            const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, radius);
            g.addColorStop(0, `rgba(255,255,255,${f.life})`);
            g.addColorStop(0.35, f.color);
            g.addColorStop(1, "rgba(255,255,255,0)");
            ctx.globalAlpha = f.life * 0.6;
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(f.x, f.y, radius, 0, TAU);
            ctx.fill();
            f.life -= 0.1 * dt;
            remaining.push(f);
        }
        flashes = remaining;
        ctx.globalAlpha = 1;
    }

    // =====================================
    // 7. หัวใจลอยหลังโชว์รูป
    // =====================================
    function spawnHeart() {
        if (hearts.length > 22) return;
        hearts.push({
            x: rand(0.05, 0.95) * W,
            size: rand(5, 11),
            sway: rand(10, 28),
            phase: Math.random() * TAU,
            age: 0,
            maxAge: rand(300, 480),
            color: pick(PINKS)
        });
    }
    function drawHeart(x, y, s) {
        ctx.beginPath();
        ctx.moveTo(x, y + s * 0.6);
        ctx.bezierCurveTo(x - s * 1.1, y - s * 0.1, x - s * 0.5, y - s * 0.9, x, y - s * 0.35);
        ctx.bezierCurveTo(x + s * 0.5, y - s * 0.9, x + s * 1.1, y - s * 0.1, x, y + s * 0.6);
        ctx.fill();
    }
    function drawHearts(dt, time) {
        const alive = [];
        for (const h of hearts) {
            h.age += dt;
            const t = h.age / h.maxAge;
            if (t >= 1) continue;
            const x = h.x + Math.sin(h.phase + time * 0.0014) * h.sway;
            const y = H + 20 - (H + 40) * t;
            ctx.globalAlpha = Math.sin(Math.PI * t) * 0.65;
            ctx.fillStyle = h.color;
            drawHeart(x, y, h.size);
            alive.push(h);
        }
        hearts = alive;
        ctx.globalAlpha = 1;
    }

    // =====================================
    // 8. ลูปหลัก (หยุดเองเมื่อไม่มีอะไรต้องวาด)
    // =====================================
    function animate(time) {
        const dt = clamp((time - lastTime) / 16.667, 0, 2.5) || 1;
        lastTime = time;

        ctx.clearRect(0, 0, W, H);

        let starFade = 1;
        if (ambient && ambientUntil) starFade = clamp((ambientUntil - time) / 3000, 0, 1);
        drawStars(time, starFade);

        drawRockets(dt);
        drawParticles(dt);
        drawFlashes(dt);

        if (ambient && time < ambientUntil && time > nextHeart) {
            spawnHeart();
            nextHeart = time + rand(350, 700);
        }
        drawHearts(dt, time);

        const active =
            sceneRunning ||
            rockets.length || particles.length || flashes.length || hearts.length ||
            (ambient && time < ambientUntil);

        if (active) {
            rafId = requestAnimationFrame(animate);
        } else {
            rafId = null;
            ambient = false;
            ctx.clearRect(0, 0, W, H);
        }
    }
    function ensureLoop() {
        if (rafId === null) {
            lastTime = performance.now();
            rafId = requestAnimationFrame(animate);
        }
    }

    // =====================================
    // 9. ลำดับเหตุการณ์
    // =====================================
    function showCount(n) {
        subtitle.textContent = n;
        subtitle.classList.remove("count");
        void subtitle.offsetWidth; // รีสตาร์ท animation
        subtitle.classList.add("count");
    }

    function startCountdown() {
        title.textContent = "กรุณารอสักครู่...";
        subtitle.textContent = "เตรียมพบกับเซอร์ไพรส์ ✨";
        let n = 3;
        later(function tick() {
            if (n > 0) {
                showCount(n--);
                later(tick, 1000);
            } else {
                startFireworks();
            }
        }, 900);
    }

    // นับถอยหลังจบ → พลุขึ้นพร้อมกันเยอะ ๆ ทีเดียว
    function startFireworks() {
        sceneRunning = true;
        title.classList.add("text-hidden");
        subtitle.classList.add("text-hidden");
        launchSalvo();
        ensureLoop();
        later(showReady, SALVO_WAIT);
    }

    // พลุจบ → ขึ้นปุ่มให้กดเปิดดูรูป
    function showReady() {
        title.textContent = "พร้อมแล้ว! 🎉";
        subtitle.classList.remove("count");
        subtitle.textContent = "กดปุ่มด้านล่างเพื่อดูรูปเลย 💗";
        title.classList.remove("text-hidden");
        subtitle.classList.remove("text-hidden");
        viewBtn.classList.remove("hidden");
    }

    function viewPhoto() {
        viewBtn.classList.add("hidden");
        title.classList.add("text-hidden");
        subtitle.classList.add("text-hidden");
        showPhoto();
    }

    function hideCaption() {
        loveMessage.classList.remove("show"); // จางหายไป เหลือแต่รูป
    }

    function startTyping() {
        let i = 0;
        typedEl.classList.add("typing");
        (function step() {
            typedEl.textContent = CAPTION.slice(0, ++i);
            if (i < CAPTION.length) {
                later(step, TYPE_SPEED);
            } else {
                later(() => {
                    typedEl.classList.remove("typing");
                    meowEl.classList.add("show");
                    later(hideCaption, HOLD_TIME);
                }, 500);
            }
        })();
    }

    function showPhoto() {
        sceneRunning = false;
        photoArea.classList.add("show");
        loveMessage.classList.add("show");
        later(startTyping, TYPE_DELAY); // พิมพ์หลังรูปขึ้น 2 วินาที

        if (!reduceMotion) {
            ambient = true;
            ambientUntil = performance.now() + AMBIENT_DURATION;
            nextHeart = 0;
            ensureLoop();
        }
    }

    function openGift() {
        if (opened) return;
        opened = true;
        gift.classList.add("open");
        button.classList.add("hidden");
        title.classList.remove("text-hidden");
        subtitle.classList.remove("text-hidden");

        startCountdown();
    }

    // =====================================
    // 10. อีเวนต์และเริ่มต้น
    // =====================================
    button.addEventListener("click", openGift);
    gift.addEventListener("click", openGift);
    gift.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openGift();
        }
    });
    viewBtn.addEventListener("click", viewPhoto);

    // ถ้าไม่มีรูป her.jpg ให้แสดงกรอบหัวใจแทน ไม่ให้เป็นรูปแตก
    const markNoPhoto = () => photoArea.classList.add("no-photo");
    photoImg.addEventListener("error", markNoPhoto);
    if (photoImg.complete && photoImg.naturalWidth === 0) markNoPhoto();

    resizeCanvas();
})();
</script>
